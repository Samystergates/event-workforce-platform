server.port=9090
spring.application.name=eventico

spring.datasource.url=${EVENTICO_DB_URL:jdbc:mysql://localhost:3306/eventico-core-demo}
spring.datasource.username=${EVENTICO_DB_USER:root}
spring.datasource.password=${EVENTICO_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100

twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.alert-recipient=${TWILIO_ALERT_RECIPIENT:}
twilio.enabled=${TWILIO_ENABLED:false}

form.client.uri=${FORM_CLIENT_URI:http://localhost:3000/review/client/}
form.sp.uri=${FORM_SP_URI:http://localhost:3001/review/service-provider/}
eventico.public-base-url=${EVENTICO_PUBLIC_BASE_URL:http://localhost:3000}
invoice.company.name=${INVOICE_COMPANY_NAME:Eventico Demo}
invoice.company.address=${INVOICE_COMPANY_ADDRESS:123 Demo Street}
invoice.company.location=${INVOICE_COMPANY_LOCATION:Demo City}
invoice.company.phone=${INVOICE_COMPANY_PHONE:+1 555 0100}
invoice.company.email=${INVOICE_COMPANY_EMAIL:contact@example.test}
invoice.company.website=${INVOICE_COMPANY_WEBSITE:example.test}
invoice.company.iban=${INVOICE_COMPANY_IBAN:DEMO-IBAN}
invoice.company.vat-number=${INVOICE_COMPANY_VAT_NUMBER:DEMO-VAT}
invoice.company.registration-number=${INVOICE_COMPANY_REGISTRATION_NUMBER:DEMO-REGISTRATION}
invoice.submission-email=${INVOICE_SUBMISSION_EMAIL:invoices@example.test}
invoice.recipient-details=${INVOICE_RECIPIENT_DETAILS:Portfolio Demo Company | Demo registration, tax, and bank details}
eventico.contact-email=${EVENTICO_CONTACT_EMAIL:contact@example.test}

microsoft.client-id=${MICROSOFT_CLIENT_ID:}
microsoft.client-secret=${MICROSOFT_CLIENT_SECRET:}
microsoft.tenant-id=${MICROSOFT_TENANT_ID:}
microsoft.mailbox=${MICROSOFT_MAILBOX:}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=25MB
server.tomcat.max-swallow-size=5242880

upload.dir=../uploads
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
outbox.topic=${OUTBOX_TOPIC:eventico.outbox.events}
outbox.dlq.topic=${OUTBOX_DLQ_TOPIC:eventico.outbox.events.dlq}
outbox.publish.fixed-delay-ms=${OUTBOX_PUBLISH_DELAY_MS:5000}
outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}
outbox.base-retry-seconds=${OUTBOX_BASE_RETRY_SECONDS:10}
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState,ping
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
resilience4j.circuitbreaker.instances.formClient.slidingWindowSize=20
resilience4j.circuitbreaker.instances.formClient.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.formClient.failureRateThreshold=50
resilience4j.retry.instances.formClient.maxAttempts=3
resilience4j.retry.instances.formClient.waitDuration=200ms

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8080}

logging.pattern.level=%5p [corr=%X{correlationId}]
