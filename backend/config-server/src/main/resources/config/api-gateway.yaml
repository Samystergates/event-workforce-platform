server:
  port: ${API_GATEWAY_PORT:8060}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: finance-api
          uri: lb://finance
          predicates:
            - Path=/api/v1/invoices/**,/api/v1/matching/**,/api/v1/bank/**
        - id: form-api
          uri: lb://form
          predicates:
            - Path=/api/form/**
        - id: form-api-v1
          uri: lb://form
          predicates:
            - Path=/api/v1/form/**
          filters:
            - RewritePath=/api/v1/form/(?<segment>.*), /api/form/$\{segment}
        - id: timeclock-api
          uri: lb://timeclock
          predicates:
            - Path=/api/timeclock/**,/api/users/**,/api/admin-config/**
        - id: timeclock-api-v1
          uri: lb://timeclock
          predicates:
            - Path=/api/v1/timeclock/**,/api/v1/users/**,/api/v1/admin-config/**
          filters:
            - RewritePath=/api/v1/timeclock/(?<segment>.*), /api/timeclock/$\{segment}
            - RewritePath=/api/v1/users/(?<segment>.*), /api/users/$\{segment}
            - RewritePath=/api/v1/admin-config/(?<segment>.*), /api/admin-config/$\{segment}
        - id: timeclock-legacy
          uri: lb://timeclock
          predicates:
            - Path=/timeclock/**
          filters:
            - RewritePath=/timeclock/(?<segment>.*), /api/timeclock/$\{segment}
        - id: core-eventico-api
          uri: lb://eventico
          predicates:
            - Path=/api/**
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
        liveness:
          include: livenessState,ping

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    enabled: ${JWT_SECURITY_ENABLED:true}
    audience: ${JWT_AUDIENCE}

gateway:
  rate-limit:
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${GATEWAY_RATE_LIMIT_RPM:600}
    trusted-proxies: ${GATEWAY_RATE_LIMIT_TRUSTED_PROXIES:}

logging:
  pattern:
    level: "%5p [corr=%X{correlationId}]"
