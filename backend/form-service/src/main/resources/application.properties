spring.application.name=form
server.port=9094

spring.datasource.url=${FORM_DB_URL:jdbc:mysql://localhost:3306/eventico-form}
spring.datasource.username=${FORM_DB_USER:root}
spring.datasource.password=${FORM_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.file-size-threshold=25MB
server.tomcat.max-swallow-size=5242880

#upload.dir=src/main/resources/uploads
upload.dir=../uploads
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

## Eureka client
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState,ping
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
resilience4j.circuitbreaker.instances.formClient.slidingWindowSize=20
resilience4j.circuitbreaker.instances.formClient.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.formClient.failureRateThreshold=50
resilience4j.retry.instances.formClient.maxAttempts=3
resilience4j.retry.instances.formClient.waitDuration=200ms
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8080}
form.cors.allowed-origins=${FORM_CORS_ALLOWED_ORIGINS:http://localhost:3001}

logging.pattern.level=%5p [corr=%X{correlationId}]
