spring:
  application:
    name: finance
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8080}"
  datasource:
    url: ${FINANCE_DB_URL:jdbc:mysql://localhost:3306/eventico-finance}
    username: ${FINANCE_DB_USER:root}
    password: ${FINANCE_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: UTC
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    scheduler-name: EventicoScheduler
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  cloud:
    task:
      name: eventico-finance-task
      single-instance-enabled: true
      closecontext-enabled: true
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
security:
  jwt:
    audience: ${JWT_AUDIENCE}

app:
  environment: development
  invoice-storage-directory: ./invoices
  ocr-text-threshold: 100
  ocr-confidence-threshold: 0.7
  document-ai-enabled: ${DOCUMENT_AI_ENABLED:false}
  document-ai-fallback-threshold: 0.5
  invoice-search-terms:
    - factuur
    - invoice
    - rekening
    - nota
  email-folders-to-check:
    - Inbox
    - Betaald
    - Te betalen
  poll-interval-seconds: 300
  matching:
    relaxed-mode: true
    min-confidence: 0.45
    auto-confirm-threshold: 0.85
    weight-reference: 0.30
    weight-amount: 0.25
    weight-iban: 0.20
    weight-date: 0.15
    weight-name: 0.10
  task:
    uri: maven://com.eventico:finance-task:0.0.1-SNAPSHOT
    name: eventico-task
msgraph:
  enabled: ${MSGRAPH_ENABLED:false}
  client-id: ${MSGRAPH_CLIENT_ID:}
  client-secret: ${MSGRAPH_CLIENT_SECRET:}
  tenant-id: ${MSGRAPH_TENANT_ID:}
  request-delay-ms: 500
  max-emails-per-poll: 50
  primary-mailbox: ${PRIMARY_EMAIL_ADDRESS:invoices@example.test}

document-ai:
  credentials-path: ${DOCUMENT_AI_CREDENTIALS_PATH:}
  project-id: ${DOCUMENT_AI_PROJECT_ID:}
  processor-location: ${DOCUMENT_AI_PROCESSOR_LOCATION:eu}
  processor-id: ${DOCUMENT_AI_PROCESSOR_ID:}
  processor-type: ${DOCUMENT_AI_PROCESSOR_TYPE:Invoice Parser}
  processor-display-name: ${DOCUMENT_AI_PROCESSOR_DISPLAY_NAME:Invoice Parser}
#INVOICE_PROCESSOR
twilio:
  enabled: false
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

logging:
  pattern:
    level: "%5p [corr=%X{correlationId}]"
  level:
    root: INFO
    com.eventico: DEBUG
  file:
    name: logs/eventico-finance.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,ping

server:
  port: 9091

finance:
  cors:
    allowed-origins: ${FINANCE_CORS_ALLOWED_ORIGINS:http://localhost:3000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      financeDefault:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
  retry:
    instances:
      financeDefault:
        maxAttempts: 3
        waitDuration: 200ms
