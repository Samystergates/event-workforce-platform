apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: eventico
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-registry
  template:
    metadata:
      labels:
        app: service-registry
    spec:
      containers:
        - name: service-registry
          image: ghcr.io/your-org/eventico-service-registry:latest
          ports:
            - containerPort: 8761
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: eventico
spec:
  selector:
    app: service-registry
  ports:
    - port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: eventico
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: ghcr.io/your-org/eventico-config-server:latest
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 20
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: eventico-platform-config
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: eventico
spec:
  selector:
    app: config-server
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: eventico
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/eventico-api-gateway:latest
          ports:
            - containerPort: 8060
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8060
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8060
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8060
            periodSeconds: 20
            timeoutSeconds: 3
          envFrom:
            - configMapRef:
                name: eventico-platform-config
          env:
            - name: JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: eventico-jwt-secrets
                  key: signing-secret
            - name: EVENTICO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: eventico-database-secrets
                  key: username
            - name: EVENTICO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: eventico-database-secrets
                  key: password
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: eventico
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8060
      targetPort: 8060
---
