services:
  mysql:
    image: mysql:8.0
    container_name: eventico-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
      MYSQL_DATABASE: eventico-core-demo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [ zookeeper ]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  service-registry:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.java-service
      args:
        SERVICE_DIR: backend/service-registry
    ports:
      - "8761:8761"

  config-server:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.java-service
      args:
        SERVICE_DIR: backend/config-server
    ports:
      - "8080:8080"

  api-gateway:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.java-service
      args:
        SERVICE_DIR: backend/api-gateway
    depends_on: [ config-server, service-registry, redis ]
    environment:
      CONFIG_SERVER_URL: http://config-server:8080
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      REDIS_HOST: redis
      JWT_SECURITY_ENABLED: "true"
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in your local environment}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in your local environment}
      GATEWAY_RATE_LIMIT_ENABLED: "true"
      GATEWAY_RATE_LIMIT_RPM: "600"
    ports:
      - "8060:8060"

  eventico:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.java-service
      args:
        SERVICE_DIR: backend/core-service
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      CONFIG_SERVER_URL: http://config-server:8080
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      EVENTICO_DB_URL: jdbc:mysql://mysql:3306/eventico-core-demo
      EVENTICO_DB_USER: root
      EVENTICO_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in your local environment}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in your local environment}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLYWAY_ENABLED: "true"
    ports:
      - "9090:9090"

  form:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.java-service
      args:
        SERVICE_DIR: backend/form-service
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      CONFIG_SERVER_URL: http://config-server:8080
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      FORM_DB_URL: jdbc:mysql://mysql:3306/eventico-form
      FORM_DB_USER: root
      FORM_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in your local environment}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLYWAY_ENABLED: "true"
    ports:
      - "9094:9094"

  timeclock:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.java-service
      args:
        SERVICE_DIR: backend/timeclock
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      CONFIG_SERVER_URL: http://config-server:8080
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      TIMECLOCK_DB_URL: jdbc:mysql://mysql:3306/eventico-timeclock
      TIMECLOCK_DB_USER: root
      TIMECLOCK_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in your local environment}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in your local environment}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLYWAY_ENABLED: "true"
    ports:
      - "8082:8082"

  finance:
    build:
      context: ../..
      dockerfile: backend/deploy/Dockerfile.java-service
      args:
        SERVICE_DIR: backend/finance
    depends_on:
      config-server:
        condition: service_started
      service-registry:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8080
      EUREKA_SERVER_URL: http://service-registry:8761/eureka/
      FINANCE_DB_URL: jdbc:mysql://mysql:3306/eventico-finance
      FINANCE_DB_USER: root
      FINANCE_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local environment}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:?Set JWT_SIGNING_SECRET in your local environment}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE in your local environment}
      FLYWAY_ENABLED: "true"
    ports:
      - "9091:9091"

volumes:
  mysql_data:
