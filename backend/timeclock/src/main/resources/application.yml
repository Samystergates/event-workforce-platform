spring:
  application:
    name: timeclock
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8080}"
  datasource:
    url: ${TIMECLOCK_DB_URL:jdbc:mysql://localhost:3306/eventico-timeclock}
    username: ${TIMECLOCK_DB_USER}
    password: ${TIMECLOCK_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState,ping
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 200ms

logging:
  file:
    name: logs/timeclock.log
  level:
    root: INFO
    com.eventico: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [corr=%X{correlationId}] [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [corr=%X{correlationId}] [%thread] %logger{36} - %msg%n"
