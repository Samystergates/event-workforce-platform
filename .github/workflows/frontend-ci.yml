name: Frontend CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  rentman-main:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/rentman-main
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/rentman-main/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  review-form-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/review-form-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/review-form-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  eventico-timeclock-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/eventico-timeclock-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/eventico-timeclock-mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
