name: Backend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend/service-registry
          - backend/config-server
          - backend/api-gateway
          - backend/timeclock
          - backend/form-service
          - backend/core-service
          - backend/finance
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B -q -Dmaven.repo.local=.m2/repo -DskipTests verify

  contract-tests:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run form contract tests
        working-directory: backend/form-service
        run: ./mvnw -B -q -Dmaven.repo.local=.m2/repo -Dtest='*ContractTest' test

      - name: Run timeclock contract tests
        working-directory: backend/timeclock
        run: ./mvnw -B -q -Dmaven.repo.local=.m2/repo -Dtest='*ContractTest' test

      - name: Run finance contract tests
        working-directory: backend/finance
        run: ./mvnw -B -q -Dmaven.repo.local=.m2/repo -Dtest='*ContractTest' test
